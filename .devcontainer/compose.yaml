services:
  proxy:
    image: docker.io/ubuntu/squid:latest
    networks: [egress, uplink]
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    restart: unless-stopped

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    userns_mode: keep-id
    command: sleep infinity
    networks: [egress]
    volumes:
      - ..:/workspace:cached
      - claude-config:/home/vscode/.claude
      # The named volume above covers the whole config directory, so the user's
      # global instructions would otherwise never reach the container. Mounted
      # read-only, and from the host path, so it stays the single source: no
      # copy of it lives in this repo. Editors that save by replacing the file
      # swap the inode; the container keeps the old one until it is restarted.
      - ${HOME}/.claude/CLAUDE.md:/home/vscode/.claude/CLAUDE.md:ro
    depends_on: [proxy]

networks:
  egress:
    internal: true
  uplink: {}

volumes:
  claude-config: {}

x-podman:
  in_pod: false
